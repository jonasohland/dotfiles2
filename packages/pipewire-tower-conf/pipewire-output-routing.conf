context.properties = {
}

context.spa-libs = {
  support.* = support/libspa-support
}

context.objects = [
  { factory = spa-node-factory
    args = {
      factory.name    = support.node.driver
      node.name       = sysclk-driver
      node.group      = pipewire.sysclk
      node.sync-group = sync.sysclk
      priority.driver = 0
      clock.name      = realtime
      clock.id        = realtime
      object.export   = true
    }     
  }
]

context.modules = [
    { name = libpipewire-module-rt
        args = {
            nice.level   = -11
            #rt.prio      = 83
            #rt.time.soft = -1
            #rt.time.hard = -1
        }
        flags = [ ifexists nofail ]
    }
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-spa-node-factory }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-filter-chain 
    args = {
      filter.graph = {
        nodes  = [
          # input ports
          { type = builtin, label = copy, name = in_L }
          { type = builtin, label = copy, name = in_R }

          # input channel mixing
          { type = builtin, label = mixer, name = in_mixer_L,   control = { "Gain 1" = 0.7 } }
          { type = builtin, label = mixer, name = in_mixer_R,   control = { "Gain 1" = 0.7 } }
          { type = builtin, label = mixer, name = in_mixer_LFE, control = { "Gain 1" = 0.5, "Gain 2" = 0.5 } }

          # room correction filters at 115 and 180 hz
          { type = builtin, label = bq_peaking, name = room_corr_115_L, control = { Freq = 115, Q = 3.5, Gain = -5 } }
          { type = builtin, label = bq_peaking, name = room_corr_115_R, control = { Freq = 115, Q = 3.5, Gain = -5 } }
          { type = builtin, label = bq_peaking, name = room_corr_180_L, control = { Freq = 180, Q = 3.5, Gain = -6 } }
          { type = builtin, label = bq_peaking, name = room_corr_180_R, control = { Freq = 180, Q = 3.5, Gain = -6 } }

          # slight low shelf
          { type = builtin, label = bq_lowshelf, name = low_shelf_L, control = { Freq = 56, Gain = 4 } }
          { type = builtin, label = bq_lowshelf, name = low_shelf_R, control = { Freq = 56, Gain = 4 } }

          # output ports
          { type = builtin, label = copy, name = out_L }
          { type = builtin, label = copy, name = out_R }
          { type = builtin, label = copy, name = out_LFE }
        ]
        links  = [
          # going to input mixers
          { output = "in_L:Out", input = "in_mixer_L:In 1" }
          { output = "in_R:Out", input = "in_mixer_R:In 1" }
          { output = "in_L:Out", input = "in_mixer_LFE:In 1" }
          { output = "in_R:Out", input = "in_mixer_LFE:In 2" }

          # going to room correction filter 1
          { output = "in_mixer_L:Out", input = "room_corr_115_L:In" }
          { output = "in_mixer_R:Out", input = "room_corr_115_R:In" }

          # going to room correction filter 2
          { output = "room_corr_115_L:Out", input = "room_corr_180_L:In" }
          { output = "room_corr_115_R:Out", input = "room_corr_180_R:In" }

          # going to low shelf
          { output = "room_corr_180_L:Out", input = "low_shelf_L:In" }
          { output = "room_corr_180_R:Out", input = "low_shelf_R:In" }

          # going to outputs
          { output = "low_shelf_L:Out",  input = "out_L:In" }
          { output = "low_shelf_R:Out",  input = "out_R:In" }
          { output = "in_mixer_LFE:Out", input = "out_LFE:In" }
        ]
        inputs  = ["in_L:In", "in_R:In"]
        outputs = ["out_L:Out", "out_R:Out"]
      }
      capture.props = {
        node.name        = speakers
        node.description = Speakers
        media.class      = Audio/Sink
        audio.position   = [FL FR]
      }
      playback.props = {
        node.name         = speakers-filters-output
        node.description  = speakers-filters-output
        media.class       = Stream/Output/Audio
        audio.position    = [AUX0 AUX1 AUX4] # L=Ch1, R=CH2, LFE=Ch5
        target.object     = alsa_output.usb-Focusrite_Scarlett_4i4_4th_Gen_S4Q366K3700949-00.pro-output-0
      }
    }
  }
  { name = libpipewire-module-loopback
    args = {
      capture.props = {
        node.name        = headphones
        node.description = Headphones
        media.class      = Audio/Sink
        audio.position   = [FL FR]
      }
      playback.props = {
        node.name         = headphones-loopback-out
        node.description  = headphones-loopback-out
        media.class       = Stream/Output/Audio
        stream.dont-remix = true
        target.object     = alsa_output.usb-Focusrite_Scarlett_4i4_4th_Gen_S4Q366K3700949-00.pro-output-0
        audio.position    = [AUX2 AUX3] # L=Ch3 R=Ch4
      }
    }
  }
]
